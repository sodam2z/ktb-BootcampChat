# Production Environment - Node Exporters
# 프로덕션 환경의 Node Exporter 타겟 목록
# 서버 추가 시 이 파일만 수정하면 자동으로 반영됩니다 (Prometheus 재시작 불필요)

# App Servers
- targets:
    - '10.0.101.12:9100'  # ktb-frontend
    - '10.0.101.47:9100'  # ktb-backend
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'app'
    service: 'frontend+backend'

# Database Cluster
- targets:
    - '10.0.101.238:9100'  # ktb-mongodb
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'database'
    service: 'mongodb'

# Redis Cluster
- targets:
    - '10.0.101.175:9100'  # ktb-redis
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'cache'
    service: 'redis'

# Monitoring Server
- targets:
    - '10.0.101.211:9100'  # ktb-monitoring
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'monitoring'
    service: 'monitoring'
