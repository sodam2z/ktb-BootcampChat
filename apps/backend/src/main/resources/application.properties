# Server Configuration
server.port=${PORT:5001}

# Tomcat Configuration
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:5}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:200}

# Database Configuration
# Spring Boot 4: connection settings moved from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

app.mongodb.pool.max-size=${MONGO_MAX_POOL_SIZE:100}
app.mongodb.pool.min-size=${MONGO_MIN_POOL_SIZE:0}
app.mongodb.pool.max-wait-time-ms=${MONGO_MAX_WAIT_TIME_MS:120000}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# File Upload Configuration
# Storage type: local or gridfs (default: local)
file.storage.type=${FILE_STORAGE_TYPE:local}
file.upload-dir=./uploads
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-northeast-2}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.path-style-access=${S3_PATH_STYLE:false}
app.s3.key-prefix=${S3_KEY_PREFIX:}
app.s3.presign-ttl=${S3_PRESIGN_TTL:10m}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# Security Configuration
app.encryption.key=${ENCRYPTION_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.encryption.salt=${ENCRYPTION_SALT:3132333435363738}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}

# Socket.IO Server Configuration
socketio.server.host=0.0.0.0
socketio.server.port=${WS_PORT:5002}
socketio.server.origin=${SOCKETIO_SERVER_ORIGIN:*}
socketio.store.type=${SOCKETIO_STORE_TYPE:redis}
rate-limit.store.type=${RATE_LIMIT_STORE_TYPE:redis}
session.store.type=${SESSION_STORE_TYPE:redis}
room-activity.flush-delay=${ROOM_ACTIVITY_FLUSH_DELAY:1s}
room-activity.debounce-window=${ROOM_ACTIVITY_DEBOUNCE_WINDOW:1s}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ktb.chatapp=INFO
logging.level.org.mongodb=INFO

# Content Moderation
chatapp.banned-word.location=classpath:fake_banned_words_10k.txt

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.packages-to-scan=com.ktb.chatapp.controller
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=read-only
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name:ktb-chat-backend}
management.metrics.tags.host=${HOSTNAME:unknown}
