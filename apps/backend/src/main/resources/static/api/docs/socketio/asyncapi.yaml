          - messageId
          - aiType
          - timestamp

    AiMessageChunkResponse:
      name: AiMessageChunk
      title: AI 메시지 청크
      summary: AI 스트리밍 청크 페이로드
      contentType: application/json
      payload:
        type: object
        properties:
          messageId:
            type: string
            description: 메시지 ID
          currentChunk:
