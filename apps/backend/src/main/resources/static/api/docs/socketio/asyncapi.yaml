          isCodeBlock:
            type: boolean
            description: 코드 블록 여부
          timestamp:
            type: integer
            format: int64
            description: 타임스탬프
          aiType:
            type: string
            enum: [CLAUDE, GEMINI, OPENAI]
            description: AI 타입
          isComplete:
            type: boolean
            description: 완료 여부
