      contentType: application/json
      payload:
        type: object
        properties:
          messageId:
            type: string
            description: 임시 메시지 ID
          _id:
            type: string
            description: 저장된 메시지 ID
          content:
            type: string
            description: 완료된 메시지 내용
          aiType:
            type: string
            enum: [CLAUDE, GEMINI, OPENAI]
            description: AI 타입
