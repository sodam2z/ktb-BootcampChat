          - error
          - aiType

  schemas:
    # ============================================
    # Request DTOs
    # ============================================

    ChatMessageRequest:
      type: object
      properties:
        room:
          type: string
          description: 채팅방 ID
          example: '507f1f77bcf86cd799439011'
        type:
          type: string
          enum: [text, file]
          description: 메시지 타입
          default: text
        content:
          type: string
          description: 메시지 내용
          example: '안녕하세요!'
        msg:
          type: string
          description: 메시지 내용 (호환성)
        fileData:
          type: object
          description: 파일 데이터 (type이 file인 경우)
          properties:
            _id:
              type: string
              description: 파일 ID
          additionalProperties: true
      required:
        - room

    FetchMessagesRequest:
      type: object
      properties:
        roomId:
          type: string
          description: 채팅방 ID
          example: '507f1f77bcf86cd799439011'
        limit:
          type: integer
          description: 가져올 메시지 개수
          default: 30
          example: 30
        before:
          type: integer
          format: int64
          description: 이전 메시지 타임스탬프 (milliseconds)
          example: 1699999999999
      required:
        - roomId

    MarkAsReadRequest:
      type: object
      properties:
        messageIds:
          type: array
          items:
            type: string
          description: 읽은 메시지 ID 목록
      required:
        - messageIds

    MessageReactionRequest:
      type: object
      properties:
        messageId:
          type: string
          description: 메시지 ID
        reaction:
          type: string
          description: 리액션 이모지
          example: '👍'
        type:
          type: string
          enum: [add, remove]
          description: 리액션 타입 (추가/제거)
          example: add
        emoji:
          type: string
          description: 이모지 (호환성)
      required:
        - messageId
        - type

    # ============================================
    # Response DTOs
    # ============================================

    MessageResponse:
      type: object
      properties:
        _id:
          type: string
          description: 메시지 ID
          example: '507f1f77bcf86cd799439011'
        room:
          type: string
          description: 채팅방 ID
        content:
          type: string
          description: 메시지 내용
        sender:
          $ref: '#/components/schemas/UserResponse'
        type:
          type: string
          enum: [text, file, system, ai]
          description: 메시지 타입
        file:
          $ref: '#/components/schemas/FileResponse'
        aiType:
          type: string
          enum: [CLAUDE, GEMINI, OPENAI]
          description: AI 타입 (AI 메시지인 경우)
        timestamp:
          type: integer
          format: int64
          description: 타임스탬프 (milliseconds)
        reactions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 리액션 맵 (이모지 -> 사용자 ID 배열)
        readers:
          type: array
          items:
            type: object
            properties:
              userId:
                type: string
              readAt:
                type: integer
                format: int64
          description: 읽음 정보
        metadata:
          type: object
          additionalProperties: true
          description: 메타데이터 (자유 형식)
      required:
        - _id
        - room
        - content
        - type
        - timestamp

    UserResponse:
      type: object
      properties:
        id:
          type: string
          description: 사용자 ID
          example: '507f1f77bcf86cd799439011'
        name:
          type: string
          description: 사용자 이름
          example: '홍길동'
        email:
          type: string
          format: email
          description: 이메일
          example: 'user@example.com'
        profileImage:
          type: string
          description: 프로필 이미지 URL
          example: 'https://example.com/profile.jpg'
      required:
        - id
        - name
        - email

    FileResponse:
      type: object
      properties:
        _id:
          type: string
          description: 파일 ID
        filename:
          type: string
          description: 저장된 파일명
        originalname:
          type: string
          description: 원본 파일명
        mimetype:
          type: string
          description: MIME 타입
          example: 'image/png'
        size:
          type: integer
          format: int64
          description: 파일 크기 (bytes)
        user:
          type: string
          description: 업로드한 사용자 ID
        uploadDate:
          type: string
          format: date-time
          description: 업로드 날짜
      required:
        - _id
        - filename
        - originalname
        - mimetype
        - size

    JoinRoomSuccessResponse:
      type: object
      properties:
        roomId:
          type: string
          description: 채팅방 ID
        participants:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
          description: 참가자 목록
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
          description: 초기 메시지 목록
        hasMore:
          type: boolean
          description: 더 많은 메시지 존재 여부
        activeStreams:
          type: array
          items:
            type: object
          description: 활성 스트림 목록
      required:
        - roomId
        - participants
        - messages
        - hasMore

    FetchMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageResponse'
          description: 메시지 목록
        hasMore:
          type: boolean
          description: 더 많은 메시지 존재 여부
      required:
        - messages
        - hasMore

    RoomListItemResponse:
      type: object
      properties:
        _id:
          type: string
          description: 채팅방 ID
        name:
          type: string
          description: 채팅방 이름
        hasPassword:
          type: boolean
          description: 비밀번호 설정 여부
        participantCount:
          type: integer
          description: 참가자 수
        recentMessageCount:
          type: integer
          description: 최근 30분간 메시지 수
        createdAt:
          type: string
          format: date-time
          description: 생성 날짜
      required:
        - _id
        - name
        - hasPassword
        - participantCount
        - recentMessageCount
        - createdAt

    ErrorPayload:
      type: object
      properties:
        code:
          type: string
          description: |
            에러 코드 (optional - 일부 응답에서는 제공되지 않을 수 있음).

            **인증/세션 관련:**
            - `SESSION_EXPIRED`: 세션이 만료되었거나 인증 정보가 유효하지 않음
            - `UNAUTHORIZED`: 인증이 필요한 작업을 시도함

            **메시지 관련:**
            - `MESSAGE_ERROR`: 메시지 저장/전송 관련 일반 오류 (데이터 없음, 사용자 없음, 권한 없음, 파일 오류 등)
            - `MESSAGE_REJECTED`: 금칙어가 포함되어 메시지가 거부됨
            - `RATE_LIMIT_EXCEEDED`: 메시지 전송 횟수 제한 초과 (1분에 10000개)
            - `LOAD_ERROR`: 이전 메시지 로드 중 오류 발생

            **메시지 읽음 처리 관련:**
            - 에러 코드 없이 message만 반환: Unauthorized, Invalid room, User not found, Room access denied 등

            **메시지 리액션 관련:**
            - 에러 코드 없이 message만 반환: Unauthorized, 메시지를 찾을 수 없습니다, 지원하지 않는 리액션 타입입니다 등

            **채팅방 퇴장 관련:**
            - 에러 코드 없이 message만 반환: Unauthorized, 채팅방 퇴장 중 오류가 발생했습니다 등
          example: MESSAGE_REJECTED
        message:
          type: string
          description: 에러 메시지. 에러 코드가 없는 경우 이 필드만 제공됩니다.
          example: 메시지 전송 중 오류가 발생했습니다.
        retryAfter:
          type: integer
          format: int64
          description: Rate limit 초과 시, 재시도 가능한 시간 (초). RATE_LIMIT_EXCEEDED 에러에만 포함됨.
          example: 30
      required:
        - message
