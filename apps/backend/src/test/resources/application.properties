server.port=5001
# make dev는 이 파일이 main 설정을 덮으므로, main과 같은 바인딩을 여기서 다시 지정한다.
# 빠지면 SocketIOConfig의 기본값 localhost가 걸려 127.0.0.1에만 붙고, 같은 LAN의 다른 기기가 접속하지 못한다.
socketio.server.host=0.0.0.0
socketio.store.type=memory
app.mongodb.pool.max-size=20
app.mongodb.pool.min-size=0
app.mongodb.pool.max-wait-time-ms=10000
spring.data.mongodb.auto-index-creation=true
app.encryption.key=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
app.encryption.salt=3132333435363738
app.jwt.secret=test-jwt-secret-for-backend-modernization-0123456789
app.jwt.expiration-ms=86400000
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=read-only
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true
